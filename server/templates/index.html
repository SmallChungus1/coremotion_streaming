<!DOCTYPE html>
<html>
  <head>
    <title>FastAPI Stream</title>
  </head>
  <body>
    <h1>Streaming Data</h1>
    <pre id="output"></pre>

    <script>
      const ws = new WebSocket(`ws://10.232.138.248:8000/ws`);
      const output = document.getElementById("output");
      ws.onmessage = (event) => {
        console.log(event.data)
        output.textContent += event.data + "\n";
      };
    </script>
  </body>
</html>
